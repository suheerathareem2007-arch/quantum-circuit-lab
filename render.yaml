services:
 -type:web
  name:qcircuitlab-api
  runtime:python
  plan:free
  region:singapore
  rootDir:backend
  buildCommand:pip install -r requirement.txt
  startCommand:uvicorn
  backend_main:app --host 0.0.0.0 --port$PORT
  healthCheckPath:/health
  envVars:
  -key:ANTHROPIC_API_KEY
   sync:false